<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <header>
        <h1>Course Enrollment System</h1>
        <p>Enroll students in a course section.</p>
    </header>

    <main>
        <section class="course-info">
            <h2 id="courseName"></h2>
            <h3 id="courseCode"></h3>
        </section>

        <section class="enrollment-form">
            <h3>Enroll a Student</h3>

            <label for="sectionNumber">Section Number:</label>
            <input
                type="number"
                id="sectionNumber"
                name="sectionNumber"
                min="1"
                placeholder="Enter section number"
            >

            <button id="enrollStudent">
                Enroll Student
            </button>
        </section>

        <section class="sections-table">
            <h3>Course Sections</h3>

            <table>
                <caption>Current Course Sections</caption>

                <thead>
                    <tr>
                        <th>Section #</th>
                        <th>Room #</th>
                        <th>Students Enrolled</th>
                        <th>Days</th>
                        <th>Instructor</th>
                    </tr>
                </thead>

                <tbody id="sections">
                    <!-- JavaScript will populate rows here -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BYUI WDD131 Object Practice</p>
    </footer>

    <script src="scripts/course.js"></script>

</body>
</html>
