
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore delicious recipes, search by ingredients and tags, and find your next favorite meal.">
    <meta name="author" content="Your Name">

    <title>Recipe Book | Find Your Next Favorite Recipe</title>

    <link rel="icon" href="images/recipe-book.png" type="image/png">
    <link rel="stylesheet" href="recipes.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="recipes.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/recipe-book.png" alt="Recipe Book logo">
            <h1>Recipe Book</h1>
        </div>

        <form id="search" role="search">
            <label for="search-input" class="visually-hidden">
                Search recipes
            </label>
            <input
                type="search"
                id="search-input"
                name="search"
                placeholder="Search recipes..."
            >
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <section class="intro">
            <h2>Find Something Delicious!</h2>
            <p>
                Explore recipes, discover new meals, and find something
                delicious to make today.
            </p>
        </section>

        <section class="recipes-section" aria-labelledby="recipes-heading">
            <h2 id="recipes-heading">Our Recipes</h2>

            <div id="recipe-container" class="recipe-container">
                <!-- JavaScript will display recipes here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Recipe Book</p>

        <div class="social">
            <a href="https://www.facebook.com/" aria-label="Facebook">
                Facebook
            </a>
            <a href="https://www.instagram.com/" aria-label="Instagram">
                Instagram
            </a>
            <a href="https://www.pinterest.com/" aria-label="Pinterest">
                Pinterest
            </a>
        </div>

        <p>Created for WDD 131 Dynamic Web Fundamentals</p>
    </footer>
</body>
</html>
