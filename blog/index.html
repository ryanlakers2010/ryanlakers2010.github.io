<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Blog</title>
    <link rel="stylesheet" href="blog.css">
</head>
<body>

    <header>
        <h1>Kids Book Reviews</h1>
        <nav>
            <ul class="navigation">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="articles-page">
        <!-- The left side column for filters/sidebar if your assignment requires it -->
        <section class="filter-section">
            <h2>Filters</h2>
            <!-- Filter options go here -->
        </section>

        <!-- The main container where blog.js will dynamically insert the 3 books -->
        <section class="articles-container" id="articlesContainer">
            <!-- JavaScript will populate the books here -->
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | WDD 131</p>
        <p id="lastModified"></p>
    </footer>

    <!-- JavaScript must be linked at the bottom -->
    <script src="blog.js" defer></script>
</body>
</html>
