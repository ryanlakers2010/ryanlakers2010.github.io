<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="blog.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <h1>My Blog</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <article class="blog-post">
            <h2>Welcome to My Blog</h2>
            <p class="post-meta">Published on <time>October 24, 2026</time></p>
            <p>This is your first blog post. You can style this text using <code>blog.css</code> and add interactive elements using <code>blog.js</code>!</p>
        </article>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2026 My Blog. All rights reserved.</p>
        </div>
    </footer>

    <!-- Link to your JavaScript file -->
    <script src="blog.js"></script>
</body>
</html>
