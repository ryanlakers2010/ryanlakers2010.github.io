<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Book Club - Build a Blog Part 2</title>
    <link rel="stylesheet" href="blog.css">
    <!-- defer ensures the script runs after the HTML is fully loaded -->
    <script src="blog.js" defer></script>
</head>
<body>

    <header>
        <h1>Kids Book Club Reviews</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Archive</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-content">
        <!-- Sidebar Filters -->
        <aside class="filters">
            <h3>Filter Articles</h3>
            <label for="age-select">Age Range:</label>
            <select id="age-select">
                <option value="all">All Ages</option>
                <option value="10-14">10-14</option>
                <option value="12-16">12-16</option>
            </select>

            <label for="genre-select">Genre:</label>
            <select id="genre-select">
                <option value="all">All Genres</option>
                <option value="Fantasy">Fantasy</option>
            </select>
        </aside>

        <!-- Main Content Container where JS inserts articles -->
        <main>
            <div id="articlesContainer" class="articles-container">
                <!-- Articles dynamically inserted by blog.js -->
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; BYU-Idaho | WDD 131 Dynamic Web Fundamentals</p>
    </footer>

</body>
</html>
