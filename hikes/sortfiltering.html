
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore hiking trails, discover new adventures, and find your next favorite hike.">
  <title>Hiking Adventures</title>

  <link rel="stylesheet" href="hikes.css">
  <script defer src="hikes.js"></script>
</head>

<body>

  <header>
    <h1>Hiking Adventures</h1>
    <p>Discover beautiful trails and explore the outdoors!</p>
  </header>

  <main>
    <section class="search-section">
      <h2>Find Your Next Adventure</h2>

      <label for="search">Search for a hike:</label>
      <input
        id="search"
        type="search"
        placeholder="Search hikes or tags..."
      >

      <button id="searchButton" type="button">Search</button>
      <button id="randomHike" type="button">Random Hike</button>
    </section>

    <section class="hikes-section">
      <h2>Featured Hiking Trails</h2>

      <div id="hike-container">

        <article class="hike-card">
          <img
            src="https://wdd131.netlify.app/examples/hikes/images/teton-canyon.jpg"
            alt="Scenic view of Teton Canyon"
          >

          <div class="hike-content">
            <h3>Teton Canyon</h3>

            <div class="hike-tags">
              <button type="button">Canyon</button>
              <button type="button">Tetons</button>
            </div>

            <p>Beautiful short (or long) hike through Teton Canyon.</p>

            <p><strong>Distance:</strong> 3 miles</p>

            <p>
              <strong>Difficulty:</strong>
              <span class="rating" role="img" aria-label="1 out of 5">
                🥾 Easy
              </span>
            </p>
          </div>
        </article>

      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Hiking Adventures | Explore the Outdoors</p>
  </footer>

</body>
</html>
