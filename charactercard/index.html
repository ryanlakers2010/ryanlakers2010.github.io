<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragonis Character Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <img id="character-image"
             src="https://placehold.co/350x400"
             alt="Character">
            <img src="mycharacter.png" alt="Character">
        
        <div class="card-content">
            <h1 id="character-name">Ryan</h1>
            <p id="character-description">
                Character description goes here.
            </p>

            <button id="changeBtn">
                Change Character
            </button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
